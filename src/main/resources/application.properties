spring.application.name=agentic-sdlc-api
spring.datasource.url=jdbc:h2:file:./data/agentic-sdlc;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.h2.console.enabled=true
springdoc.swagger-ui.csrf.enabled=true
agentic.security.requester.username=${AGENTIC_SDLC_REQUESTER_USERNAME:}
agentic.security.requester.password=${AGENTIC_SDLC_REQUESTER_PASSWORD:}
agentic.security.reviewer.username=${AGENTIC_SDLC_REVIEWER_USERNAME:}
agentic.security.reviewer.password=${AGENTIC_SDLC_REVIEWER_PASSWORD:}
agentic.audit.key=${AGENTIC_SDLC_AUDIT_KEY:}
